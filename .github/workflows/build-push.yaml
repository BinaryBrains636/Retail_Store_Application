name: Retail Store CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '03_Docker_Files/services/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '03_Docker_Files/services/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  # Stage 1: Lint and Validate
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          echo "Linting Dockerfiles..."
          dockerfiles=$(find ./03_Docker_Files/services -name "Dockerfile")
          for dockerfile in $dockerfiles; do
            echo "Checking $dockerfile"
            hadolint --ignore DL3008 --ignore DL3013 "$dockerfile" || true
          done

      - name: Validate docker-compose
        run: |
          echo "Validating docker-compose.yaml..."
          cd ./03_Docker_Files
          docker-compose config > /dev/null

      - name: Validate Helm charts
        run: |
          echo "Validating Helm charts..."
          charts=$(find ./03_Docker_Files/services -name "Chart.yaml")
          for chart in $charts; do
            chart_dir=$(dirname "$chart")
            echo "Validating $chart_dir"
            helm lint "$chart_dir"
          done

  # Stage 2: Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [ui, cart, catalog, checkout, orders, users]
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./03_Docker_Files/services/${{ matrix.service }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save image as artifact
        run: |
          docker save ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }} | gzip > /tmp/${{ matrix.service }}-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp/${{ matrix.service }}-image.tar.gz
          retention-days: 1

  # Stage 3: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [ui, cart, catalog, checkout, orders, users]
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/${{ matrix.service }}-image.tar.gz

      - name: Run container health check
        run: |
          echo "Running health check for ${{ matrix.service }}..."
          docker run -d --name test-${{ matrix.service }} \
            ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }}
          sleep 30
          docker exec test-${{ matrix.service }} curl -f http://localhost:8080/actuator/health || exit 1
          docker stop test-${{ matrix.service }}

  # Stage 4: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [ui, cart, catalog, checkout, orders, users]
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/${{ matrix.service }}-image.tar.gz

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Stage 5: Push to ECR
  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [ui, cart, catalog, checkout, orders, users]
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/${{ matrix.service }}-image.tar.gz

      - name: Tag image for ECR
        run: |
          docker tag ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:latest
          docker tag ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.ref_name }}

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.ref_name }}
          docker push ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}:${{ github.sha }}

      - name: Update Helm chart image tag
        run: |
          perl -i -pe "s|repository:.*|repository: ${{ env.ECR_REGISTRY }}/retail-store-sample-${{ matrix.service }}|g" ./03_Docker_Files/services/${{ matrix.service }}/chart/values.yaml
          perl -i -pe "s|tag:.*|tag: latest|g" ./03_Docker_Files/services/${{ matrix.service }}/chart/values.yaml

      - name: Commit updated Helm charts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ./03_Docker_Files/services/${{ matrix.service }}/chart/values.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update ${{ matrix.service }} Helm chart image tag [skip ci]"
          git push

  # Stage 6: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.retail-store.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name retail-store-staging --region ${{ env.AWS_REGION }}

      - name: Deploy with Helm
        run: |
          cd ./03_Docker_Files
          ./deploy-eks.sh

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/owner=retail-store -n default --timeout=300s

  # Stage 7: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://retail-store.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name retail-store-production --region ${{ env.AWS_REGION }}

      - name: Deploy with Helm
        run: |
          cd ./03_Docker_Files
          NAMESPACE=production ./deploy-eks.sh

      - name: Verify deployment
        run: |
          kubectl get pods -n production
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/owner=retail-store -n production --timeout=300s

      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests..."
          # curl -f https://retail-store.com/actuator/health || exit 1

  # Stage 8: Notify
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "Deployment to production succeeded!"
            # Add Slack/email notification here
          else
            echo "Deployment to production failed!"
            # Add failure notification here
            exit 1
          fi




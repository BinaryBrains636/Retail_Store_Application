name: Setup ECR Repositories (Terraform)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
  TERRAFORM_VERSION: 1.5.0

jobs:
  create-repositories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create State Infrastructure
        working-directory: ./infrastructure/terraform/state
        run: |
          terraform init
          terraform import aws_s3_bucket.terraform_state retail-store-terraform-state-538707363561 2>/dev/null || true
          terraform import aws_dynamodb_table.terraform_state_lock terraform-state-lock 2>/dev/null || true
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"
          terraform apply -auto-approve tfplan

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/ecr
        run: terraform init

      - name: Import existing ECR repositories if not in state
        working-directory: ./infrastructure/terraform/ecr
        run: |
          for service in ui cart catalog checkout orders users; do
            if ! terraform state list | grep -q "aws_ecr_repository.retail_store\[\"${service}\"\]"; then
              echo "Importing ${service} repository..."
              terraform import aws_ecr_repository.retail_store["${service}"] retail-store/${service} || echo "Failed to import ${service}, may not exist"
            else
              echo "${service} already in state, skipping import"
            fi
          done

      - name: Terraform Plan
        working-directory: ./infrastructure/terraform/ecr
        run: terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/ecr
        run: terraform apply -auto-approve tfplan

      - name: List repositories
        run: |
          aws ecr describe-repositories --region ${{ env.AWS_REGION }}

name: Infrastructure Provisioning

on:
  push:
    branches: [ "main" ]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
  TF_VERSION: 1.5.0

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform init

      - name: Terraform Plan (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform apply -auto-approve tfplan

      - name: Terraform Init (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform init

      - name: Terraform Plan (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform apply -auto-approve tfplan

      - name: Get VPC Outputs
        id: vpc-outputs
        run: |
          cd infrastructure/terraform/vpc
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "public_subnet_ids=$(terraform output -raw public_subnet_ids)" >> $GITHUB_OUTPUT
          echo "private_subnet_ids=$(terraform output -raw private_subnet_ids)" >> $GITHUB_OUTPUT

      - name: Terraform Init (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform init

      - name: Terraform Plan (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform plan -out=tfplan -var="vpc_id=${{ steps.vpc-outputs.outputs.vpc_id }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform apply -auto-approve tfplan

      - name: Get EKS Outputs
        id: eks-outputs
        run: |
          cd infrastructure/terraform/eks
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ steps.eks-outputs.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Terraform Init (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform init

      - name: Terraform Plan (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform plan -out=tfplan -var="cluster_name=${{ steps.eks-outputs.outputs.cluster_name }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform apply -auto-approve tfplan

      - name: Verify EKS Cluster
        run: |
          kubectl get nodes
          kubectl get pods -n kube-system

      - name: Output EKS Details
        run: |
          echo "EKS Cluster provisioned successfully"
          kubectl cluster-info

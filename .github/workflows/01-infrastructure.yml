name: Infrastructure Provisioning

on:
  push:
    branches: [ "main" ]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
  TF_VERSION: 1.5.0

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (State Infrastructure)
        run: |
          cd infrastructure/terraform/state
          terraform init

      - name: Import existing state infrastructure
        run: |
          cd infrastructure/terraform/state
          terraform import aws_s3_bucket.terraform_state retail-store-terraform-state-538707363561 2>/dev/null || true

      - name: Terraform Plan (State Infrastructure)
        run: |
          cd infrastructure/terraform/state
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (State Infrastructure)
        run: |
          cd infrastructure/terraform/state
          terraform apply -auto-approve tfplan

      - name: Terraform Init (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform init

      - name: Import existing ECR repositories if not in state
        run: |
          cd infrastructure/terraform/ecr
          for service in ui cart catalog checkout orders users; do
            if ! terraform state list | grep -q "aws_ecr_repository.retail_store\[\"${service}\"\]"; then
              echo "Importing ${service} repository..."
              terraform import 'aws_ecr_repository.retail_store["${service}"]' retail-store/${service} || echo "Failed to import ${service}, may not exist"
            else
              echo "${service} already in state, skipping import"
            fi
          done

      - name: Terraform Plan (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (ECR)
        run: |
          cd infrastructure/terraform/ecr
          terraform apply -auto-approve tfplan

      - name: Terraform Init (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform init

      - name: Import existing VPC resources if not in state
        run: |
          cd infrastructure/terraform/vpc
          # Import VPC
          if ! terraform state list | grep -q "aws_vpc.main"; then
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=retail-store-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")
            if [ -n "$VPC_ID" ]; then
              echo "Importing VPC: $VPC_ID"
              terraform import aws_vpc.main "$VPC_ID" || echo "Failed to import VPC"
            else
              echo "VPC not found by tag, trying CIDR"
              VPC_ID=$(aws ec2 describe-vpcs --filters "Name=cidr,Values=10.0.0.0/16" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")
              if [ -n "$VPC_ID" ]; then
                echo "Importing VPC by CIDR: $VPC_ID"
                terraform import aws_vpc.main "$VPC_ID" || echo "Failed to import VPC"
              fi
            fi
          fi
          # Import Internet Gateway
          if ! terraform state list | grep -q "aws_internet_gateway.igw"; then
            IGW_ID=$(aws ec2 describe-internet-gateways --filters "Name=tag:Name,Values=retail-store-igw" --query "InternetGateways[0].InternetGatewayId" --output text 2>/dev/null || echo "")
            if [ -n "$IGW_ID" ]; then
              echo "Importing IGW: $IGW_ID"
              terraform import aws_internet_gateway.igw "$IGW_ID" || echo "Failed to import IGW"
            fi
          fi
          # Import subnets by CIDR
          if ! terraform state list | grep -q "aws_subnet.public\[0\]"; then
            SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=cidr,Values=10.0.0.0/24" --query "Subnets[0].SubnetId" --output text 2>/dev/null || echo "")
            if [ -n "$SUBNET_ID" ]; then
              echo "Importing public subnet 0: $SUBNET_ID"
              terraform import 'aws_subnet.public["0"]' "$SUBNET_ID" || echo "Failed to import public subnet 0"
            fi
          fi
          if ! terraform state list | grep -q "aws_subnet.public\[1\]"; then
            SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=cidr,Values=10.0.1.0/24" --query "Subnets[0].SubnetId" --output text 2>/dev/null || echo "")
            if [ -n "$SUBNET_ID" ]; then
              echo "Importing public subnet 1: $SUBNET_ID"
              terraform import 'aws_subnet.public["1"]' "$SUBNET_ID" || echo "Failed to import public subnet 1"
            fi
          fi
          if ! terraform state list | grep -q "aws_subnet.private\[0\]"; then
            SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=cidr,Values=10.0.2.0/24" --query "Subnets[0].SubnetId" --output text 2>/dev/null || echo "")
            if [ -n "$SUBNET_ID" ]; then
              echo "Importing private subnet 0: $SUBNET_ID"
              terraform import 'aws_subnet.private["0"]' "$SUBNET_ID" || echo "Failed to import private subnet 0"
            fi
          fi
          if ! terraform state list | grep -q "aws_subnet.private\[1\]"; then
            SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=cidr,Values=10.0.3.0/24" --query "Subnets[0].SubnetId" --output text 2>/dev/null || echo "")
            if [ -n "$SUBNET_ID" ]; then
              echo "Importing private subnet 1: $SUBNET_ID"
              terraform import 'aws_subnet.private["1"]' "$SUBNET_ID" || echo "Failed to import private subnet 1"
            fi
          fi

      - name: Terraform Plan (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform plan -out=tfplan -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (VPC)
        run: |
          cd infrastructure/terraform/vpc
          terraform apply -auto-approve tfplan

      - name: Get VPC Outputs
        id: vpc-outputs
        run: |
          cd infrastructure/terraform/vpc
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "public_subnet_ids=$(terraform output -raw public_subnet_ids)" >> $GITHUB_OUTPUT
          echo "private_subnet_ids=$(terraform output -raw private_subnet_ids)" >> $GITHUB_OUTPUT

      - name: Terraform Init (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform init

      - name: Terraform Plan (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform plan -out=tfplan -var="vpc_id=${{ steps.vpc-outputs.outputs.vpc_id }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (EKS)
        run: |
          cd infrastructure/terraform/eks
          terraform apply -auto-approve tfplan

      - name: Get EKS Outputs
        id: eks-outputs
        run: |
          cd infrastructure/terraform/eks
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ steps.eks-outputs.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Terraform Init (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform init

      - name: Terraform Plan (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform plan -out=tfplan -var="cluster_name=${{ steps.eks-outputs.outputs.cluster_name }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (EKS Add-ons)
        run: |
          cd infrastructure/terraform/eks-addons
          terraform apply -auto-approve tfplan

      - name: Verify EKS Cluster
        run: |
          kubectl get nodes
          kubectl get pods -n kube-system

      - name: Output EKS Details
        run: |
          echo "EKS Cluster provisioned successfully"
          kubectl cluster-info

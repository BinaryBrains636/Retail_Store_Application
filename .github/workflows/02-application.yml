name: Application Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - "03_Docker_Files/services/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
  SHA_TAG: sha-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, cart, catalog, orders, checkout]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Git info
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          git log -1 --oneline

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: vars
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/retail-store/${{ matrix.service }}"
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "TAGS=latest $SHA_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: Verify Dockerfile
        run: |
          cd 03_Docker_Files/services/${{ matrix.service }}
          head -5 Dockerfile

      - name: Build Docker image
        run: |
          cd 03_Docker_Files/services/${{ matrix.service }}
          DOCKER_BUILDKIT=1 docker build --no-cache --pull -t $IMAGE_BASE:latest .

      - name: Push to ECR
        run: |
          for tag in $TAGS; do
            docker tag $IMAGE_BASE:latest $IMAGE_BASE:$tag
            docker push $IMAGE_BASE:$tag
          done

  helm-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, cart, catalog, orders, checkout]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Git info
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          git log -1 --oneline

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name retail-store-eks --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Update Helm values with ECR image
        run: |
          CHART_PATH="03_Docker_Files/services/${{ matrix.service }}/chart"
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ steps.login-ecr.outputs.registry }}/retail-store/${{ matrix.service}}:$IMAGE_TAG"
          
          # Create custom values file
          cat > custom-values.yaml <<EOF
          image:
            repository: ${{ steps.login-ecr.outputs.registry }}/retail-store/${{ matrix.service }}
            tag: $IMAGE_TAG
            pullPolicy: IfNotPresent
          EOF

      - name: Deploy with Helm
        run: |
          CHART_PATH="03_Docker_Files/services/${{ matrix.service }}/chart"
          RELEASE_NAME="${{ matrix.service }}"
          NAMESPACE="default"
          
          # Upgrade or install the Helm release
          helm upgrade --install $RELEASE_NAME $CHART_PATH \
            --namespace $NAMESPACE \
            --values custom-values.yaml \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Show pod logs if deployment failed
        if: failure()
        run: |
          kubectl get pods -n default -l app.kubernetes.io/instance=${{ matrix.service }} -o name | head -1 | xargs -I {} kubectl logs {} -n default --tail=50 || true

      - name: Verify deployment
        run: |
          DEPLOYMENT_NAME=$(kubectl get deployment -n default -l app.kubernetes.io/instance=${{ matrix.service }} -o jsonpath='{.items[0].metadata.name}')
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n default
          kubectl get pods -l app.kubernetes.io/instance=${{ matrix.service }} -n default

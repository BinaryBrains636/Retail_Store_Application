{{- if .Values.postgresql.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "users.postgresql.fullname" . }}
  labels:
    {{- include "users.postgresql.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "users.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.postgresql.podAnnotations }}
      annotations:
        {{- toYaml .Values.postgresql.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "users.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.app.persistence.password }}
            - name: POSTGRES_DB
              value: {{ .Values.app.persistence.name }}
            - name: POSTGRES_USER
              value: {{ .Values.app.persistence.username }}
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 256m
              memory: 512Mi
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

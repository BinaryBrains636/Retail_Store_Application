# Server Configuration
server.port=8080
server.tomcat.accesslog.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://${RETAIL_USERS_PERSISTENCE_ENDPOINT:localhost}:${RETAIL_USERS_PERSISTENCE_PORT:5432}/${RETAIL_USERS_PERSISTENCE_NAME:users}
spring.datasource.username=${RETAIL_USERS_PERSISTENCE_USERNAME:users_user}
spring.datasource.password=${RETAIL_USERS_PERSISTENCE_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Spring Profiles
spring.profiles.active=prod

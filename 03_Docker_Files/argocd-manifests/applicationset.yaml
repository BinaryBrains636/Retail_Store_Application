apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: retail-store-app
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: ui
            path: 03_Docker_Files/services/ui/chart
          - name: cart
            path: 03_Docker_Files/services/cart/chart
          - name: catalog
            path: 03_Docker_Files/services/catalog/chart
          - name: checkout
            path: 03_Docker_Files/services/checkout/chart
          - name: orders
            path: 03_Docker_Files/services/orders/chart
          - name: users
            path: 03_Docker_Files/services/users/chart
  template:
    metadata:
      name: '{{name}}'
      labels:
        app.kubernetes.io/name: '{{name}}'
        app.kubernetes.io/part-of: retail-store
    spec:
      project: default
      source:
        repoURL: https://github.com/BinaryBrains636/Retail_Store_Application.git
        targetRevision: main
        path: '{{path}}'
        helm:
          valueFiles:
            - values.yaml
          values: |
            image:
              repository: 538707363561.dkr.ecr.us-west-2.amazonaws.com/retail-store/{{name}}
              tag: latest
              pullPolicy: Always
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - Validate=false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
